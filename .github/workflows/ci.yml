name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README for CI
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: actualizar README con la nueva feature"

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validate Local Dev Token
        run: |
          echo "Validando contra la variable local DEV_TOKEN..."
          if [ "$LOCAL_DEV_TOKEN" = "$DEV_TOKEN" ]; then
            echo "Token válido."
          else
            echo "Error: El token no coincide."
            exit 1
          fi