name: Prueba Runner/Secrets

on: [push]

jobs:
  comparar-tokens:
    runs-on: self-hosted
    steps:
      - name: Comprobación del repositorio
        uses: actions/checkout@v4

      - name: Comparar token de desarrollo
        env:
          SECRET_DEV: ${{ secrets.DEV_TOKEN }}
          LOCAL_DEV: ${{ vars.LOCAL_DEV_TOKEN }} 
        run: |
          echo "Comprobación del DEV_TOKEN..."
          # En Linux bash (ajusta a PowerShell si tu runner corre en Windows):
          if [ "${{ secrets.DEV_TOKEN }}" = "$LOCAL_DEV_TOKEN" ]; then
            echo "¡Los tokens COINCIDEN correctamente!"
            exit 0
          else
            echo "Error: Los tokens NO coinciden."
            exit 1
          fi